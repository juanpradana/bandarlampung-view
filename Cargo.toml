[workspace]
resolver = "2"
members = ["crates/api", "crates/cli", "crates/web-core"]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT"
rust-version = "1.75"

[workspace.dependencies]
anyhow = "1"
thiserror = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
chrono = { version = "0.4", features = ["serde"] }
strsim = "0.11"
regex = "1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

# async / http
tokio = { version = "1", features = ["rt-multi-thread", "macros", "time", "signal"] }
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "json", "stream", "gzip"] }
axum = "0.7"
tower = "0.5"
tower-http = { version = "0.6", features = ["fs", "cors", "compression-gzip", "trace", "set-header"] }
hyper = "1"
bytes = "1"
futures-util = "0.3"

# cli
clap = { version = "4", features = ["derive", "env"] }

# wasm client
wasm-bindgen = "0.2"
wasm-bindgen-futures = "0.4"
gloo-net = "0.6"
console_error_panic_hook = "0.1"
web-sys = { version = "0.3", features = [
  "Window", "Document", "Element", "HtmlElement", "HtmlImageElement",
  "HtmlInputElement", "HtmlSelectElement", "HtmlVideoElement", "NodeList",
  "Event", "EventTarget", "MouseEvent", "KeyboardEvent", "ResizeObserver",
  "ResizeObserverEntry", "IntersectionObserver", "IntersectionObserverEntry",
  "IntersectionObserverInit", "CustomEvent", "Storage", "Location",
] }
js-sys = "0.3"